<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Host Console | Mind Reader</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <div class="topbar">
      <div>
        <p class="eyebrow">HOST CONSOLE</p>
        <h1>CONVERSATION DOMINANCE MONITOR</h1>
        <p class="sub">Share the room code with participant phones.</p>
      </div>

      <div class="room-panel">
        <span>ROOM</span>
        <strong id="roomCode">----</strong>
      </div>
    </div>

    <section class="control-panel">
      <button id="copyLinkBtn" class="button small">Copy Join Link</button>
      <button id="resetBtn" class="button small secondary">Reset Timing</button>
    </section>

    <section id="dashboard" class="dashboard">
      <p class="sub">Waiting for participants to join.</p>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="host.js"></script>
</body>
</html>
